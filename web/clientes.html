<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

    <div class="layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div>

                <div class="logo">

                    <div class="logo-icon">
                        N
                    </div>

                    <div>
                        <strong>NEW FLOOR</strong>
                        <span>ERP PROPOSTAS</span>
                    </div>

                </div>

                <nav class="menu">

                    <a href="dashboard.html">
                        Dashboard
                    </a>

                    <a class="active" href="clientes.html">
                        Clientes
                    </a>

                    <a href="servicos.html">
                        Serviços
                    </a>

                    <a href="propostas.html">
                        Propostas
                    </a>

                </nav>

            </div>

            <div class="user-box">

                <div class="avatar">
                    L
                </div>

                <div>
                    <strong>Lucas</strong>
                    <span>Administrador</span>
                </div>

            </div>

        </aside>

        <!-- MAIN -->

        <main class="main-content">

            <div class="topbar">

                <div>

                    <h1>
                        Clientes
                    </h1>

                    <p>
                        Gerencie todos os clientes cadastrados.
                    </p>

                </div>

                <div class="top-actions">

                    <input type="text" class="search" placeholder="Pesquisar cliente...">

                    <button class="btn-new" data-bs-toggle="modal" data-bs-target="#modalCliente">

                        + Novo cliente

                    </button>

                </div>

            </div>

            <!-- TABELA -->

            <div class="table-container">

                <table class="table table-borderless align-middle">

                    <thead>

                        <tr>

                            <th>Cliente</th>

                            <th>Empresa</th>

                            <th>Telefone</th>

                            <th>Email</th>

                            <th></th>

                        </tr>

                    </thead>

                    <tbody id="listaClientes">

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <!-- MODAL -->

    <div class="modal fade" id="modalCliente" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content modal-premium">

                <div class="modal-header border-0">

                    <h5 class="modal-title">
                        Novo Cliente
                    </h5>

                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <form id="formCliente">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Nome</label>

                                <input type="text" id="nome" class="form-control premium-input-light">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Empresa</label>

                                <input type="text" id="empresa" class="form-control premium-input-light">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Telefone</label>

                                <input type="text" id="telefone" class="form-control premium-input-light">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Email</label>

                                <input type="email" id="email" class="form-control premium-input-light">

                            </div>

                            <div class="col-12 mb-3">

                                <label>Endereço</label>

                                <input type="text" id="endereco" class="form-control premium-input-light">

                            </div>

                        </div>

                        <button class="btn-new w-100 mt-3">

                            Salvar cliente

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>
    <div class="modal fade" id="modalEditarCliente" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header border-0">

                    <h5 class="modal-title">
                        Gerenciar Cliente
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <form id="formEditarCliente">

                        <input type="hidden" id="editarId">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Nome</label>

                                <input type="text" id="editarNome" class="form-control premium-input-light">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Empresa</label>

                                <input type="text" id="editarEmpresa" class="form-control premium-input-light">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Telefone</label>

                                <input type="text" id="editarTelefone" class="form-control premium-input-light">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Email</label>

                                <input type="email" id="editarEmail" class="form-control premium-input-light">

                            </div>

                            <div class="col-12 mb-4">

                                <label>Endereço</label>

                                <input type="text" id="editarEndereco" class="form-control premium-input-light">

                            </div>

                        </div>

                        <div class="d-flex gap-3">

                            <button class="btn-new flex-fill">

                                Salvar alterações

                            </button>

                            <button type="button" class="btn btn-danger px-4" id="btnExcluirCliente">

                                Excluir

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/clientes.js"></script>

</body>

</html>
