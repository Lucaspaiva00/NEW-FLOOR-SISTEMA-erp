<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propostas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/kanban.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">
            <div>
                <div class="logo">
                    <div class="logo-icon">N</div>
                    <div>
                        <strong>NEW FLOOR</strong>
                        <span>ERP PROPOSTAS</span>
                    </div>
                </div>

                <nav class="menu">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="clientes.html">Clientes</a>
                    <a href="servicos.html">Serviços</a>
                    <a class="active" href="propostas.html">Propostas</a>
                </nav>
            </div>

            <div class="user-box">
                <div class="avatar">L</div>
                <div>
                    <strong>Lucas</strong>
                    <span>Administrador</span>
                </div>
            </div>
        </aside>

        <main class="main-content">

            <div class="topbar">
                <div>
                    <h1>Propostas</h1>
                    <p>Gerencie todas as propostas comerciais.</p>
                </div>

                <div class="top-actions">
                    <input type="text" class="search" placeholder="Pesquisar proposta...">

                    <button class="btn-new" data-bs-toggle="modal" data-bs-target="#modalNovaProposta">
                        + Nova proposta
                    </button>
                </div>
            </div>

            <div class="kpis">
                <div class="kpi-card">
                    <span>Pendentes</span>
                    <h2 id="kpiPendentes">0</h2>
                </div>

                <div class="kpi-card">
                    <span>Aprovadas</span>
                    <h2 id="kpiAprovadas">0</h2>
                </div>

                <div class="kpi-card">
                    <span>Executando</span>
                    <h2 id="kpiExecutando">0</h2>
                </div>

                <div class="kpi-card">
                    <span>Faturadas</span>
                    <h2 id="kpiFaturadas">0</h2>
                </div>
            </div>

            <div class="kanban">

                <div class="kanban-column">
                    <div class="kanban-header">Pendentes</div>
                    <div class="kanban-list" id="colunaPendente" data-status="PENDENTE"></div>
                </div>

                <div class="kanban-column">
                    <div class="kanban-header">Aprovadas</div>
                    <div class="kanban-list" id="colunaAprovada" data-status="APROVADA"></div>
                </div>

                <div class="kanban-column">
                    <div class="kanban-header">Executando</div>
                    <div class="kanban-list" id="colunaExecutando" data-status="EXECUTANDO"></div>
                </div>

                <div class="kanban-column">
                    <div class="kanban-header">Faturadas</div>
                    <div class="kanban-list" id="colunaFaturada" data-status="FATURADA"></div>
                </div>

            </div>

        </main>

    </div>

    <div class="modal fade" id="modalNovaProposta" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">

                <div class="modal-header border-0">
                    <h5 class="modal-title">Nova proposta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="formNovaProposta">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Cliente</label>
                                <select id="clienteId" class="form-control premium-input-light"></select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Título</label>
                                <input type="text" id="titulo" class="form-control premium-input-light" required>
                            </div>

                            <div class="col-12 mb-4">
                                <label>Descrição</label>
                                <textarea id="descricao"
                                    class="form-control premium-input-light textarea-premium"></textarea>
                            </div>
                        </div>

                        <div class="proposal-services">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5>Serviços</h5>

                                <button type="button" class="btn-action" id="btnAdicionarServico">
                                    + Adicionar
                                </button>
                            </div>

                            <div id="listaItensProposta"></div>
                        </div>

                        <div class="proposal-total mt-4">
                            <span>Total</span>
                            <h2 id="valorTotal">R$ 0,00</h2>
                        </div>

                        <button class="btn-new w-100 mt-4">
                            Salvar proposta
                        </button>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="modalProposta" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header border-0">
                    <h5 class="modal-title">Gerenciar proposta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="editarId">

                    <div class="mb-4">
                        <label>Status</label>

                        <select id="editarStatus" class="form-control premium-input-light">
                            <option value="PENDENTE">PENDENTE</option>
                            <option value="APROVADA">APROVADA</option>
                            <option value="EXECUTANDO">EXECUTANDO</option>
                            <option value="FATURADA">FATURADA</option>
                            <option value="RECUSADA">RECUSADA</option>
                        </select>
                    </div>

                    <div class="d-flex gap-3">
                        <button class="btn-new flex-fill" id="btnSalvarStatus">
                            Salvar status
                        </button>

                        <button class="btn btn-danger px-4" id="btnExcluirProposta">
                            Excluir
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <script src="js/propostas.js"></script>

</body>

</html>
