<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas - Paiva Tech Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/vendedores.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f5f7; padding: 40px; }
        .container-admin { max-width: 900px; margin: 0 auto; }
        .card-form { background: #fff; border-radius: 16px; padding: 30px; margin-bottom: 30px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    </style>
</head>

<body>

    <div class="container-admin">

        <h1>Empresas (tenants)</h1>
        <p class="text-muted">Provisionamento de novas empresas no sistema. Acesso restrito a SUPER_ADMIN.</p>

        <div class="card-form">

            <h5>Nova empresa</h5>

            <form id="formEmpresa" class="row g-3 mt-2">

                <div class="col-md-6">
                    <label>Nome da empresa</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label>Slug (identificador único, sem espaços)</label>
                    <input type="text" id="slug" class="form-control" placeholder="ex: sba" required>
                </div>

                <div class="col-md-12"><hr></div>

                <div class="col-md-6">
                    <label>Nome do administrador</label>
                    <input type="text" id="adminNome" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label>E-mail do administrador</label>
                    <input type="email" id="adminEmail" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label>Senha temporária do administrador</label>
                    <input type="password" id="adminSenha" class="form-control" required minlength="6">
                </div>

                <div class="col-md-12">
                    <button class="btn-new">Criar empresa</button>
                </div>

            </form>

        </div>

        <div class="card-form">
            <h5>Empresas cadastradas</h5>
            <div id="listaEmpresas" class="mt-3"></div>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/empresas.js"></script>

</body>

</html>
