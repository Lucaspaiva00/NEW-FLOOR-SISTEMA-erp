<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas - NEW FLOOR ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/vendedores.css">
    <link rel="stylesheet" href="css/menu-mobile.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <button class="mobile-menu-btn">☰</button>
    <div class="mobile-overlay"></div>

    <div class="layout">

        <aside class="sidebar">

            <div>

                <div class="logo">
                    <img src="assets/logo-newfloor.png" alt="New Floor" class="logo-img">
                </div>

                <nav class="menu">

                    <a href="dashboard.html">Dashboard</a>
                    <a href="clientes.html">Clientes</a>
                    <a href="vendedores.html">Vendedores</a>
                    <a href="servicos.html">Serviços</a>
                    <a href="propostas.html">Propostas</a>
                    <a href="agenda.html">Agenda</a>
                    <a href="templates.html">Templates</a>
                    <a href="usuarios.html">Usuários</a>
                    <a class="active" href="empresas.html">Empresas</a>

                </nav>

            </div>

            <div class="user-box">
                <div class="avatar">L</div>
                <div>
                    <strong>Lucas</strong>
                    <span>Administrador</span>
                </div>
            </div>

        </aside>

        <main class="main-content">

            <div class="topbar">

                <div>
                    <h1>Empresas</h1>
                    <p>Provisionamento de novas empresas (tenants) no sistema.</p>
                </div>

                <div class="top-actions">

                    <button class="btn-new" data-bs-toggle="modal" data-bs-target="#modalEmpresa">
                        + Nova empresa
                    </button>

                </div>

            </div>

            <div class="kpis">

                <div class="kpi-card">
                    <span>Total de empresas</span>
                    <h2 id="kpiTotal">0</h2>
                </div>

                <div class="kpi-card">
                    <span>Ativas</span>
                    <h2 id="kpiAtivas">0</h2>
                </div>

                <div class="kpi-card">
                    <span>Inativas</span>
                    <h2 id="kpiInativas">0</h2>
                </div>

            </div>

            <div class="usuarios-grid" id="listaEmpresas">
            </div>

        </main>

    </div>

    <!-- NOVA EMPRESA -->
    <div class="modal fade" id="modalEmpresa" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content modal-premium">

                <div class="modal-header border-0">
                    <h5 class="modal-title">Nova empresa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <form id="formEmpresa">

                        <div class="form-section">

                            <div class="section-title">Dados da empresa</div>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label>Nome da empresa</label>
                                    <input type="text" id="nome" class="form-control premium-input-light" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Slug (identificador único)</label>
                                    <input type="text" id="slug" class="form-control premium-input-light" placeholder="ex: sba" required>
                                </div>

                            </div>

                        </div>

                        <div class="form-section">

                            <div class="section-title">Administrador da empresa</div>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label>Nome</label>
                                    <input type="text" id="adminNome" class="form-control premium-input-light" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>E-mail</label>
                                    <input type="email" id="adminEmail" class="form-control premium-input-light" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Senha temporária</label>
                                    <input type="password" id="adminSenha" class="form-control premium-input-light" required minlength="6">
                                </div>

                            </div>

                        </div>

                        <button class="btn-new w-100">Criar empresa</button>

                    </form>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/empresas.js"></script>

    <script src="js/menu-mobile.js"></script>
    <script src="js/sidebar.js"></script>

</body>

</html>
