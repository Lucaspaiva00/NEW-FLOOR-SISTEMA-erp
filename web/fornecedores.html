        <main class="main-content material-page"><header class="material-header"><div><p class="eyebrow">CADASTRO DE COMPRAS</p><h1>Fornecedores</h1><p>Contatos e condições de pagamento das suas compras.</p></div><button id="novoFornecedor" class="material-button primary" type="button">＋ Novo fornecedor</button></header><section class="material-catalog"><label class="catalog-search">Buscar fornecedor<input id="buscaFornecedor" type="search" placeholder="Nome ou CNPJ"></label><div id="listaFornecedores"></div><div class="d-flex gap-3 mt-3 align-items-center"><button id="anteriorFornecedor" class="btn btn-outline-secondary">Anterior</button><span id="paginaFornecedor"></span><button id="proximoFornecedor" class="btn btn-outline-secondary">Próxima</button></div><p id="erroFornecedor" role="status"></p></section></main></div>
<div class="modal fade material-editor-modal" id="modalFornecedor" tabindex="-1" aria-labelledby="tituloFornecedor"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h2 class="modal-title" id="tituloFornecedor">Novo fornecedor</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body"><form id="formFornecedor"><input id="fornecedorId" type="hidden"><section class="form-section"><h3>Dados do fornecedor</h3><div class="material-grid"><label class="material-field">Nome / razão social<input id="nome" required maxlength="500"></label><label class="material-field">CNPJ<input id="cnpj" inputmode="numeric" maxlength="18"><button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="buscarCnpj">Buscar CNPJ</button><small id="cnpjStatus" role="status"></small></label><label class="material-field">E-mail<input id="email" type="email" maxlength="300"></label><label class="material-field">Telefone<input id="telefone" maxlength="100"></label><label class="material-field field-wide">Endereço<input id="endereco" maxlength="2000"></label></div></section><section class="form-section"><h3>Pagamento e disponibilidade</h3><div class="material-grid"><label class="material-field">Forma de pagamento<input id="formaPagamento" maxlength="100" placeholder="Pix, transferência, boleto"></label><label class="material-field">Prazo padrão (dias corridos)<input id="prazoPagamentoDias" type="number" min="0" max="3650" step="1"></label><label class="material-field field-wide">Condições comerciais<textarea id="condicoesPagamento" maxlength="2000" rows="3"></textarea></label></div><label class="d-flex gap-2"><input id="ativo" type="checkbox" checked> Fornecedor ativo</label></section><div class="material-actions"><p id="mensagem" role="status"></p><button id="salvarFornecedor" type="submit" class="material-button primary">Salvar fornecedor</button></div></form></div></div></div></div>
