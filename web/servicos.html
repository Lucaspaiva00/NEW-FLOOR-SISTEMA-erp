<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Serviços</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

    <div class="layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div>

                <div class="logo">

                    <div class="logo-icon">
                        N
                    </div>

                    <div>
                        <strong>NEW FLOOR</strong>
                        <span>ERP PROPOSTAS</span>
                    </div>

                </div>

                <nav class="menu">

                    <a href="dashboard.html">
                        Dashboard
                    </a>

                    <a href="clientes.html">
                        Clientes
                    </a>

                    <a class="active" href="servicos.html">
                        Serviços
                    </a>

                    <a href="propostas.html">
                        Propostas
                    </a>

                </nav>

            </div>

            <div class="user-box">

                <div class="avatar">
                    L
                </div>

                <div>
                    <strong>Lucas</strong>
                    <span>Administrador</span>
                </div>

            </div>

        </aside>

        <!-- MAIN -->

        <main class="main-content">

            <div class="topbar">

                <div>

                    <h1>
                        Serviços
                    </h1>

                    <p>
                        Gerencie todos os serviços cadastrados.
                    </p>

                </div>

                <div class="top-actions">

                    <input type="text" class="search" placeholder="Pesquisar serviço...">

                    <button class="btn-new" data-bs-toggle="modal" data-bs-target="#modalServico">

                        + Novo serviço

                    </button>

                </div>

            </div>

            <!-- GRID -->

            <div class="services-grid" id="listaServicos">

            </div>

        </main>

    </div>

    <!-- MODAL NOVO -->

    <div class="modal fade" id="modalServico" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header border-0">

                    <h5 class="modal-title">
                        Novo Serviço
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <form id="formServico">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Nome</label>

                                <input type="text" id="nome" class="form-control premium-input-light">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Valor</label>

                                <input type="number" id="valor" class="form-control premium-input-light">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Unidade</label>

                                <input type="text" id="unidade" class="form-control premium-input-light">

                            </div>

                            <div class="col-12 mb-3">

                                <label>Descrição</label>

                                <textarea id="descricao"
                                    class="form-control premium-input-light textarea-premium"></textarea>

                            </div>

                        </div>

                        <button class="btn-new w-100">

                            Salvar serviço

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- MODAL EDITAR -->

    <div class="modal fade" id="modalEditarServico" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header border-0">

                    <h5 class="modal-title">
                        Gerenciar Serviço
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <form id="formEditarServico">

                        <input type="hidden" id="editarId">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Nome</label>

                                <input type="text" id="editarNome" class="form-control premium-input-light">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Valor</label>

                                <input type="number" id="editarValor" class="form-control premium-input-light">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Unidade</label>

                                <input type="text" id="editarUnidade" class="form-control premium-input-light">

                            </div>

                            <div class="col-12 mb-3">

                                <label>Descrição</label>

                                <textarea id="editarDescricao"
                                    class="form-control premium-input-light textarea-premium"></textarea>

                            </div>

                        </div>

                        <div class="d-flex gap-3">

                            <button class="btn-new flex-fill">

                                Salvar alterações

                            </button>

                            <button type="button" class="btn btn-danger px-4" id="btnExcluirServico">

                                Excluir

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/servicos.js"></script>

</body>

</html>
