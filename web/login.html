<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>New Floor ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body class="login-body">

    <div class="overlay"></div>

    <div class="container-fluid">

        <div class="row min-vh-100">

            <div class="col-lg-7 left-side d-none d-lg-flex">

                <div class="hero-content">

                    <h1>
                        Transforme propostas
                        em vendas.
                    </h1>

                    <p>
                        Plataforma moderna para criação,
                        gerenciamento e aprovação
                        de propostas comerciais.
                    </p>

                </div>

            </div>

            <div class="col-lg-5 d-flex align-items-center justify-content-center">

                <div class="auth-card">

                    <div class="tabs">

                        <button class="tab active" id="btnLogin">
                            Login
                        </button>

                        <button class="tab" id="btnCadastro">
                            Cadastro
                        </button>

                    </div>

                    <!-- LOGIN -->

                    <form id="formLogin" novalidate>

                        <h2>
                            Bem-vindo de volta
                        </h2>

                        <p class="subtitle">
                            Faça login para acessar o painel.
                        </p>

                        <div id="loginAlert" class="auth-alert hidden" role="alert"></div>

                        <div class="mb-3">

                            <label for="loginEmail">Email</label>

                            <input type="email" id="loginEmail" class="form-control premium-input"
                                autocomplete="email" required>

                            <div id="loginEmailErro" class="field-error hidden"></div>

                        </div>

                        <div class="mb-4">

                            <label for="loginSenha">Senha</label>

                            <input type="password" id="loginSenha" class="form-control premium-input"
                                autocomplete="current-password" required>

                            <div id="loginSenhaErro" class="field-error hidden"></div>

                        </div>

                        <button type="submit" class="btn-premium" id="btnEntrar">
                            Entrar
                        </button>

                    </form>

                    <!-- CADASTRO -->

                    <form id="formCadastro" style="display: none;" novalidate>

                        <h2>
                            Criar conta
                        </h2>

                        <p class="subtitle">
                            Cadastre-se para começar.
                        </p>

                        <div id="cadastroAlert" class="auth-alert hidden" role="alert"></div>

                        <div class="mb-3">

                            <label for="cadastroNome">Nome</label>

                            <input type="text" id="cadastroNome" class="form-control premium-input"
                                autocomplete="name" required minlength="2">

                            <div id="cadastroNomeErro" class="field-error hidden"></div>

                        </div>

                        <div class="mb-3">

                            <label for="cadastroEmail">Email</label>

                            <input type="email" id="cadastroEmail" class="form-control premium-input"
                                autocomplete="email" required>

                            <div id="cadastroEmailErro" class="field-error hidden"></div>

                        </div>

                        <div class="mb-4">

                            <label for="cadastroSenha">Senha</label>

                            <input type="password" id="cadastroSenha" class="form-control premium-input"
                                autocomplete="new-password" required minlength="6">

                            <div id="cadastroSenhaErro" class="field-error hidden"></div>

                        </div>

                        <button type="submit" class="btn-premium" id="btnCriarConta">
                            Criar conta
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
