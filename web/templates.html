<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Templates - NEW FLOOR ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/menu-mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>
    <button class="mobile-menu-btn">☰</button>
    <div class="mobile-overlay"></div>
    <div class="layout">

        <aside class="sidebar">

            <div>

                <div class="logo">

                    <div class="logo-icon">
                        N
                    </div>

                    <div>

                        <strong>NEW FLOOR</strong>

                        <span>ERP PROPOSTAS</span>

                    </div>

                </div>

                <nav class="menu">

                    <a href="dashboard.html">
                        Dashboard
                    </a>

                    <a href="clientes.html">
                        Clientes
                    </a>

                    <a href="servicos.html">
                        Serviços
                    </a>

                    <a href="propostas.html">
                        Propostas
                    </a>

                    <a href="agenda.html">
                        Agenda
                    </a>

                    <a class="active" href="templates.html">
                        Templates
                    </a>

                </nav>

            </div>

        </aside>

        <main class="main-content">

            <div class="topbar">

                <div>

                    <h1>
                        Templates de Propostas
                    </h1>

                    <p>
                        Personalize completamente os PDFs enviados aos clientes.
                    </p>

                </div>

                <button class="btn-new" data-bs-toggle="modal" data-bs-target="#modalTemplate">

                    + Novo Template

                </button>

            </div>

            <div class="table-container">

                <table class="table align-middle">

                    <thead>

                        <tr>

                            <th>Nome</th>

                            <th>Cor Primária</th>

                            <th>Status</th>

                            <th></th>

                        </tr>

                    </thead>

                    <tbody id="listaTemplates">

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <div class="modal fade" id="modalTemplate" tabindex="-1">

        <div class="modal-dialog modal-xl">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Template de Proposta
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <form id="formTemplate">

                        <input type="hidden" id="templateid">

                        <div class="row">

                            <div class="col-md-4 mb-3">

                                <label>Nome</label>

                                <input type="text" id="nome" class="form-control">

                            </div>

                            <div class="col-md-4 mb-3">

                                <label>Cor Primária</label>

                                <input type="color" id="corPrimaria" class="form-control form-control-color">

                            </div>

                            <div class="col-md-4 mb-3">

                                <label>Cor Secundária</label>

                                <input type="color" id="corSecundaria" class="form-control form-control-color">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Cabeçalho</label>

                                <textarea id="cabecalho" class="form-control"></textarea>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Rodapé</label>

                                <textarea id="rodape" class="form-control"></textarea>

                            </div>

                            <div class="col-md-12 mb-3">

                                <label>Texto apresentação</label>

                                <textarea id="textoApresentacao" class="form-control"></textarea>

                            </div>

                            <div class="col-md-12 mb-3">

                                <label>Texto garantia</label>

                                <textarea id="textoGarantia" class="form-control"></textarea>

                            </div>

                            <div class="col-md-12 mb-3">

                                <label>Texto pagamento</label>

                                <textarea id="textoPagamento" class="form-control"></textarea>

                            </div>

                            <div class="col-md-12 mb-3">

                                <label>Texto observação</label>

                                <textarea id="textoObservacao" class="form-control"></textarea>

                            </div>

                            <div class="col-md-12 mb-3">

                                <label>HTML Personalizado</label>

                                <textarea rows="10" id="htmlPersonalizado" class="form-control"></textarea>

                            </div>

                            <div class="col-md-12 mb-3">

                                <label>CSS Personalizado</label>

                                <textarea rows="8" id="cssPersonalizado" class="form-control"></textarea>

                            </div>

                        </div>

                        <div class="row mt-3">

                            <div class="col-md-2">

                                <div class="form-check">

                                    <input type="checkbox" id="ativo" class="form-check-input">

                                    <label class="form-check-label">
                                        Ativo
                                    </label>

                                </div>

                            </div>

                            <div class="col-md-2">

                                <div class="form-check">

                                    <input type="checkbox" id="exibirLogo" class="form-check-input">

                                    <label class="form-check-label">
                                        Logo
                                    </label>

                                </div>

                            </div>

                            <div class="col-md-2">

                                <div class="form-check">

                                    <input type="checkbox" id="exibirTelefone" class="form-check-input">

                                    <label class="form-check-label">
                                        Telefone
                                    </label>

                                </div>

                            </div>

                            <div class="col-md-2">

                                <div class="form-check">

                                    <input type="checkbox" id="exibirEmail" class="form-check-input">

                                    <label class="form-check-label">
                                        E-mail
                                    </label>

                                </div>

                            </div>

                            <div class="col-md-2">

                                <div class="form-check">

                                    <input type="checkbox" id="exibirEndereco" class="form-check-input">

                                    <label class="form-check-label">
                                        Endereço
                                    </label>

                                </div>

                            </div>

                            <div class="col-md-2">

                                <div class="form-check">

                                    <input type="checkbox" id="exibirAssinatura" class="form-check-input">

                                    <label class="form-check-label">
                                        Assinatura
                                    </label>

                                </div>

                            </div>

                        </div>

                        <button class="btn-new w-100 mt-4">

                            Salvar Template

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/templates.js"></script>
    <script src="js/menu-mobile.js"></script>
</body>

</html>
